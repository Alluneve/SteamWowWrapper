name: Build

on:
  push:
    branches:
      - master
    tags:
      - "v*"

jobs:
  debug:
    if: github.ref == 'refs/heads/master'
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Publish Debug
        run: >
          dotnet publish SteamWowWrapper.csproj
          --configuration Debug
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          --output publish

      - name: Upload Debug artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: SteamWowWrapper-win-x64-debug
          path: publish/SteamWowWrapper.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Publish Release
        run: >
          dotnet publish SteamWowWrapper.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          --output publish

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          "publish/SteamWowWrapper.exe"
          --repo "${{ github.repository }}"
          --generate-notes