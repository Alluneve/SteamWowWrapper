name: Build

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: >
          dotnet publish SteamWowWrapper.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          --output publish

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: SteamWowWrapper-win-x64
          path: publish/SteamWowWrapper.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Download build
        uses: actions/download-artifact@v8.0.1
        with:
          name: SteamWowWrapper-win-x64
          path: artifact

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          "artifact/SteamWowWrapper.exe"
          --repo "${{ github.repository }}"
          --generate-notes